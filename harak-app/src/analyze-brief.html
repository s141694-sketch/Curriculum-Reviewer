      <div class="brief">
        <label for="brief-text">ماذا تريد من التحليل؟</label>
        <div class="quick" id="brief-quick" aria-label="طلبات جاهزة">
          <button class="btn btn-secondary btn-sm" type="button" data-brief="حلّل هذا المنهج تحليلًا شاملًا: البنية، وضوح الأهداف ومستوياتها في بلوم، التسلسل المنطقي، التوازن بين الوحدات، واقترح تحسينات محددة.">تحليل شامل</button>
          <button class="btn btn-secondary btn-sm" type="button" data-brief="ارصد الملاحظات على هذا المنهج: كل ملاحظة في سطر مع اقتباس الموضع المعني واقتراح المعالجة.">رصد الملاحظات</button>
          <button class="btn btn-secondary btn-sm" type="button" data-brief="راجع الأخطاء اللغوية والإملائية والصياغات الركيكة في النص: اقتبس كل خطأ ثم اكتب التصحيح.">الأخطاء اللغوية</button>
          <button class="btn btn-secondary btn-sm" type="button" data-brief="صنّف كل هدف في المنهج على مستويات بلوم المعدَّل، وأعد صياغة الأهداف غير القابلة للقياس كأهداف سلوكية تبدأ بـ أن.">مطابقة بلوم</button>
          <button class="btn btn-secondary btn-sm" type="button" data-brief="ما الموضوعات أو الأنشطة أو أساليب التقويم الناقصة في هذا المنهج مقارنة بما يُتوقع من مادته ومستواه؟ اقترح إضافات محددة لكل وحدة.">النواقص والإضافات</button>
        </div>
        <textarea id="brief-text" rows="3" placeholder="اكتب طلبك بكلماتك: تحليل، رصد ملاحظات، مقارنة بمعيار، أو أي سؤال عن هذا المنهج. اتركه فارغًا لتحليل آلي فقط."></textarea>
        <label class="check"><input type="checkbox" id="brief-auto" checked> إرفاق التحليل الآلي (بلوم، المعايير، الاكتمال) مع التقرير</label>
      </div>
