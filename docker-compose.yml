# On-premise stack. Copy .env.example to .env and fill it in first.
#
#   docker compose up -d                      # app only (Claude API)
#   docker compose --profile local-ai up -d   # app + local model (fully offline)
#
# For the fully local setup set LLM_PROVIDER=ollama and
# OLLAMA_URL=http://ollama:11434 in .env, then pull a model once:
#   docker compose exec ollama ollama pull qwen2.5:14b

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - reviewer-data:/app/data

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment to use an NVIDIA GPU (requires the NVIDIA container toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  reviewer-data:
  ollama-models:
